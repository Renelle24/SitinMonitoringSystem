{% block nav_logout %}
  <a href="{{ url_for('logout') }}" class="btn-logout">Log out</a>
{% endblock %}

{% block nav_links %}
  <a href="{{ url_for('admin_dashboard') }}"  class="{{ 'active' if request.endpoint == 'admin_dashboard' }}">🏠 Home</a>
  <a href="{{ url_for('search_student') }}"   class="{{ 'active' if request.endpoint == 'search_student' }}">🔍 Search</a>
  <a href="{{ url_for('student_list') }}"     class="{{ 'active' if request.endpoint in ['student_list','add_student','edit_student'] }}">👨‍🎓 Students</a>
  <a href="{{ url_for('sitin_form') }}"       class="{{ 'active' if request.endpoint == 'sitin_form' }}">🖥️ Sit-in</a>
  <a href="{{ url_for('current_sitin') }}"    class="{{ 'active' if request.endpoint == 'current_sitin' }}">📋 Sit-in Records</a>
  <a href="{{ url_for('sitin_reports') }}"    class="{{ 'active' if request.endpoint == 'sitin_reports' }}">📄 Reports</a>
  <a href="{{ url_for('analytics') }}"        class="{{ 'active' if request.endpoint == 'analytics' }}">📊 Analytics</a>
  <a href="{{ url_for('rewards') }}"          class="{{ 'active' if request.endpoint == 'rewards' }}">⭐ Rewards</a>
  <a href="{{ url_for('reservation') }}"      class="{{ 'active' if request.endpoint == 'reservation' }}">📅 Reservation</a>
  <a href="{{ url_for('feedback_reports') }}" class="{{ 'active' if request.endpoint == 'feedback_reports' }}">💬 Feedback</a>
{% endblock %}
